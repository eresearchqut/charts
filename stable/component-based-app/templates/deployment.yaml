{{- range $name, $spec := .Values.components }}
{{- $tag := dig "image" "tag" "" $spec }}
{{- if empty $tag }}
  {{- fail (printf "component '%s': image.tag must be set explicitly. Set components.%s.image.tag" $name $name) }}
{{- end }}
{{- $repository := required (printf "component '%s': image.repository must be set explicitly. Set components.%s.image.repository" $name $name) (dig "image" "repository" "" $spec) }}
{{- $image := printf "%s:%s" $repository $tag }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "component-based-app.fullname" $ }}-{{ $name }}
  labels:
    app.kubernetes.io/component: {{ $name }}
    {{- include "component-based-app.labels" $ | nindent 4 }}
spec:
  replicas: {{ $spec.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "component-based-app.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      {{- if or $spec.configMaps $spec.podAnnotations }}
      annotations:
        {{- if $spec.configMaps }}
        checksum/config: {{ toYaml $spec.configMaps | sha256sum | quote }}
        {{- end }}
        {{- with $spec.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        app.kubernetes.io/component: {{ $name }}
        app.kubernetes.io/role: server
        {{- include "component-based-app.labels" $ | nindent 8 }}
        {{- with $spec.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "component-based-app.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automount }}

      {{- with $spec.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podSecurityContext := $.Values.podSecurityContext }}
      {{- if hasKey $spec "podSecurityContext" }}
      {{- $podSecurityContext = $spec.podSecurityContext }}
      {{- end }}
      {{- with $podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $spec.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $spec.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $spec.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $spec.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $spec.initContainer }}
      initContainers:
        - name: init
          image: {{ $image }}
          command:
            {{- toYaml $spec.initContainer.command | nindent 12 }}

          {{- $initResources := $.Values.resources }}
          {{- if hasKey $spec "resources" }}
          {{- $initResources = $spec.initResources }}
          {{- end }}
          {{- with $initResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $initSecurityContext := or $spec.initContainer.containerSecurityContext $spec.containerSecurityContext $.Values.containerSecurityContext }}
          {{- with $initSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $spec.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $spec.allowDatabaseAccess $spec.appSecretKeys }}
          env:
            {{- if $spec.allowDatabaseAccess }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "component-based-app.databaseSecretName" $ }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "component-based-app.databaseSecretName" $ }}
                  key: password
            - name: DB_HOST
              value: {{ printf "%s-rw" (include "component-based-app.databaseClusterName" $) | quote }}
            - name: DB_PORT
              value: "5432"
            {{- end }}
            {{- range $spec.appSecretKeys }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $spec.secretName | default (printf "%s-secrets" (include "component-based-app.fullname" $)) }}
                  key: {{ .secretKey }}
            {{- end }}
          {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ $image }}
          command:
            {{- toYaml $spec.command | nindent 12 }}
          ports:
            - containerPort: {{ $spec.port }}
              name: http
          {{- $resources := or $spec.resources $.Values.resources }}
          {{- with $resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $spec.livenessProbe }}
          livenessProbe:
            {{- include "component-based-app.httpProbe" (dict "kind" "liveness" "probe" .) | nindent 12 }}
          {{- end }}
          {{- with $spec.readinessProbe }}
          readinessProbe:
            {{- include "component-based-app.httpProbe" (dict "kind" "readiness" "probe" .) | nindent 12 }}
          {{- end }}
          {{- with $spec.startupProbe }}
          startupProbe:
            {{- include "component-based-app.httpProbe" (dict "kind" "startup" "probe" .) | nindent 12 }}
          {{- end }}

          {{- $containerSecurityContext := $.Values.containerSecurityContext }}
          {{- if hasKey $spec "containerSecurityContext" }}
          {{- $containerSecurityContext = $spec.containerSecurityContext }}
          {{- end }}
          {{- with $containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $spec.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $spec.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- if $spec.allowDatabaseAccess }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "component-based-app.databaseSecretName" $ }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "component-based-app.databaseSecretName" $ }}
                  key: password
            - name: DB_HOST
              value: {{ printf "%s-rw" (include "component-based-app.databaseClusterName" $) | quote }}
            - name: DB_PORT
              value: "5432"
            {{- end }}
            {{- range $spec.appSecretKeys }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ $spec.secretName | default (printf "%s-secrets" (include "component-based-app.fullname" $)) }}
                  key: {{ .secretKey }}
            {{- end }}
            - name: PORT
              value: {{ $spec.port | quote }}
            {{- if $spec.podIPEnvName }}
            - name: {{ $spec.podIPEnvName }}
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            {{- $nodeIPEnvName := $spec.nodeIPEnvName | default "NODE_IP" }}
            {{- if or $spec.nodeIPEnvName (and $spec.podIPEnvName $spec.allowedHostsEnvName) }}
            - name: {{ $nodeIPEnvName }}
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- end }}
            {{- if and $spec.podIPEnvName $spec.allowedHostsEnvName }}
            {{- $allowedHosts := printf "%s-%s,$(%s)" (include "component-based-app.fullname" $) $name $spec.podIPEnvName }}
            {{- if $nodeIPEnvName }}
            {{- $allowedHosts = printf "%s,$(%s)" $allowedHosts $nodeIPEnvName }}
            {{- end }}
            {{- if $.Values.ingress.host }}
            {{- $allowedHosts = printf "%s,%s" $allowedHosts $.Values.ingress.host }}
            {{- end }}
            - name: {{ $spec.allowedHostsEnvName }}
              value: {{ $allowedHosts | quote }}
            {{- end }}
            {{- $isIngressComponent := false }}
            {{- if $.Values.ingress.host }}
            {{- if $.Values.ingress.paths }}
            {{- range $.Values.ingress.paths }}
            {{- if eq $name .targetComponent }}
            {{- $isIngressComponent = true }}
            {{- end }}
            {{- end }}
            {{- else if eq $name $.Values.ingress.targetComponent }}
            {{- $isIngressComponent = true }}
            {{- end }}
            {{- end }}
            {{- if $isIngressComponent }}
            - name: FQDN
              value: {{ $.Values.ingress.host | quote }}
            {{- end }}
            {{- range $spec.serviceLinks }}
            {{- $targetSpec := index $.Values.components .targetName }}
            {{- if empty $targetSpec }}
              {{- fail (printf "serviceLinks: component '%s' not found" .targetName) }}
            {{- end }}
            {{- if not $targetSpec }}
              {{- fail (printf "serviceLinks: component '%s' is disabled" .targetName) }}
            {{- end }}
            - name: {{ .envName }}
              value: {{ printf "http://%s-%s:%s%s" (include "component-based-app.fullname" $) .targetName (toString $targetSpec.port) (.path | default "/") | quote }}
            {{- end }}
            {{- with $spec.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
