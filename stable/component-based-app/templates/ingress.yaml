{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
  {{- fail "ingress.hosts must contain at least one host when ingress.enabled is true" }}
{{- end }}
{{- range .Values.ingress.hosts }}
{{- if not .paths }}
  {{- fail (printf "ingress.hosts: host '%s' must define at least one path" .host) }}
{{- end }}
{{- range .paths }}
{{- $target := index ($.Values.components | default dict) .targetComponent }}
{{- if empty $target }}
  {{- fail (printf "ingress.hosts: component '%s' not found in .Values.components" .targetComponent) }}
{{- end }}
{{- if not $target }}
  {{- fail (printf "ingress.hosts: component '%s' is disabled" .targetComponent) }}
{{- end }}
{{- end }}
{{- end }}
{{- $root := $ }}
{{- $classNames := list }}
{{- $hostsByClass := dict }}
{{- range .Values.ingress.hosts }}
{{- $class := .className | default $root.Values.ingress.className | default "" }}
{{- if not (has $class $classNames) }}
{{- $classNames = append $classNames $class }}
{{- end }}
{{- $existing := get $hostsByClass $class | default list }}
{{- $_ := set $hostsByClass $class (append $existing .) }}
{{- end }}
{{- $multi := gt (len $classNames) 1 }}
{{- range $classNames }}
{{- $class := . }}
{{- $classHosts := get $hostsByClass $class }}
{{- $name := ternary (printf "%s-%s" (include "component-based-app.fullname" $root) ($class | default "default" | replace "." "-") | trunc 63 | trimSuffix "-") (include "component-based-app.fullname" $root) $multi }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "component-based-app.labels" $root | nindent 4 }}
  {{- with $root.Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ $class }}
  {{- with $root.Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $classHosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "component-based-app.componentServiceName" (dict "root" $root "component" .targetComponent) }}
                port:
                  name: {{ .portName | default "http" }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
