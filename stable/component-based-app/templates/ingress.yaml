{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
  {{- fail "ingress.hosts must contain at least one host when ingress.enabled is true" }}
{{- end }}
{{- range .Values.ingress.hosts }}
{{- if not .paths }}
  {{- fail (printf "ingress.hosts: host '%s' must define at least one path" .host) }}
{{- end }}
{{- range .paths }}
{{- $target := index ($.Values.components | default dict) .targetComponent }}
{{- if empty $target }}
  {{- fail (printf "ingress.hosts: component '%s' not found in .Values.components" .targetComponent) }}
{{- end }}
{{- if not $target }}
  {{- fail (printf "ingress.hosts: component '%s' is disabled" .targetComponent) }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "component-based-app.fullname" . }}
  labels:
    {{- include "component-based-app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "" }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "component-based-app.componentServiceName" (dict "root" $ "component" .targetComponent) }}
                port:
                  name: {{ .portName | default "http" }}
          {{- end }}
    {{- end }}
{{- end }}
