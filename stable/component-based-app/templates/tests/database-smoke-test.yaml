{{- if .Values.database.enabled }}
{{- $db := dig "cluster" "initdb" "database" "app" .Values.database }}
{{- $user := dig "cluster" "initdb" "owner" $db .Values.database }}
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "component-based-app.fullname" . }}-db-test-connection"
  labels:
    app.kubernetes.io/component: database
    {{- include "component-based-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: pg-isready
      image: {{ .Values.database.cluster.imageName }}
      command: ['pg_isready']
      args:
        - '-h'
        - '{{ include "component-based-app.databaseClusterName" . }}-rw'
        - '-U'
        - '{{ $user }}'
        - '-d'
        - '{{ $db }}'
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "component-based-app.databaseSecretName" . }}
              key: password
  restartPolicy: Never
{{- end }}
