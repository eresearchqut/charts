{{- if and .Values.ingress.enabled .Values.avi.enabled }}
{{- $root := . }}
{{- range .Values.ingress.hosts }}
{{- $host := . }}
{{- $avi := $host.avi | default dict }}
{{- $name := printf "%s-%s" (include "component-based-app.fullname" $root) ($host.host | replace "." "-") | trunc 63 | trimSuffix "-" }}
---
apiVersion: ako.vmware.com/v1alpha1
kind: HostRule
metadata:
  name: {{ $name }}
  labels:
    {{- include "component-based-app.labels" $root | nindent 4 }}
spec:
  virtualhost:
    fqdn: {{ $host.host }}
    analyticsProfile: System-Analytics-Profile
    applicationProfile: {{ $avi.applicationProfile | default $root.Values.avi.hostRule.applicationProfile | default "System-HTTP" }}
    enableVirtualHost: true
    errorPageProfile: qut-error-pages
    fqdnType: Exact
    httpPolicy:
      policySets:
        {{- ($avi.policySets | default $root.Values.avi.hostRule.policySets) | toYaml | nindent 8 }}
    {{- with $avi.sslKeyCertificate }}
    tls:
      sslKeyCertificate:
        name: {{ . | quote }}
        type: ref
      termination: edge
    {{- end }}
---
apiVersion: ako.vmware.com/v1alpha1
kind: HTTPRule
metadata:
  name: {{ $name }}
  labels:
    {{- include "component-based-app.labels" $root | nindent 4 }}
spec:
  fqdn: {{ $host.host }}
  paths:
    - target: /
      healthMonitors:
        {{- ($avi.healthMonitors | default $root.Values.avi.httpRule.healthMonitors) | toYaml | nindent 8 }}
      loadBalancerPolicy:
        algorithm: {{ ($avi.loadBalancerPolicy).algorithm | default $root.Values.avi.httpRule.loadBalancerPolicy.algorithm }}
{{- end }}
{{- end }}
