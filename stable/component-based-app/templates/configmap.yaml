{{- /*
Render ConfigMaps declared per component under components.<name>.configMaps.
Each entry is `<configmap-name>: { <fileKey>: <content> }`.
*/}}
{{- range $name, $spec := .Values.components }}
{{- range $cmName, $cmData := $spec.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  labels:
    app.kubernetes.io/component: {{ $name }}
    {{- include "component-based-app.labels" $ | nindent 4 }}
data:
  {{- toYaml $cmData | nindent 2 }}
{{- end }}
{{- end }}
