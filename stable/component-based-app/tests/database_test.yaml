suite: Database Wiring & Secrets
templates:
  - deployment.yaml

release:
  name: myapp
  namespace: default

tests:
  - it: main container gets default CNPG auto-generated secret and host
    set:
      components:
        api:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8000
          command: ["python", "run.py"]
          allowDatabaseAccess: true
      database:
        enabled: true
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: myapp-database-app
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: myapp-database-rw
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PORT
            value: "5432"

  - it: uses custom initdb secret name when set
    set:
      components:
        api:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8000
          command: ["python", "run.py"]
          allowDatabaseAccess: true
      database:
        enabled: true
        cluster:
          initdb:
            secret:
              name: my-db-secret
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: my-db-secret
                key: username

  - it: uses database.fullnameOverride for host and default secret name
    set:
      components:
        api:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8000
          command: ["python", "run.py"]
          allowDatabaseAccess: true
      database:
        enabled: true
        fullnameOverride: legacy-db
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: legacy-db-rw
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: legacy-db-app
                key: username
