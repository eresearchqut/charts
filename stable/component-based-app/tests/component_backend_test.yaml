# USECASE: Component with a Database
#
# A component that connects to a database, runs an init container
# for migrations, and exposes its pod IP via the Downward API.
# Tests that DB credentials flow to both containers and the pod IP is accessible.

suite: Component with a Database
templates:
  - deployment.yaml
  - service.yaml

release:
  name: myapp
  namespace: default

set:
  components:
    api:
      image:
        repository: "example.com/app"
        tag: "latest"
      port: 8000
      command: ["python", "run.py"]
      livenessProbe:
        path: /health
      allowDatabaseAccess: true
      podIPEnvName: POD_IP
      allowedHostsEnvName: ALLOWED_HOSTS
      initContainer:
        command: ["python", "manage.py", "migrate"]
  database:
    enabled: true
    image:
      repository: "example.com/app"
      tag: "latest"

tests:
  - it: main container gets database credentials
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: myapp-database-app
                key: username
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_HOST
            value: myapp-database-rw
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_PORT
            value: "5432"

  - it: init container also gets database credentials
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                name: myapp-database-app
                key: username
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DB_HOST
            value: myapp-database-rw
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DB_PORT
            value: "5432"

  - it: pod IP is exposed via the Downward API
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP

  - it: node IP is exposed via the Downward API
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NODE_IP
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP

  - it: ALLOWED_HOSTS references the service, pod IP, and node IP
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOWED_HOSTS
            value: myapp-component-based-app-api,$(POD_IP),$(NODE_IP)

  - it: init container gets appSecretKeys even without database access
    set:
      components:
        api:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8000
          command: ["python", "run.py"]
          livenessProbe:
            path: /health
          allowDatabaseAccess: false
          appSecretKeys:
            - envName: API_KEY
              secretKey: api-key
          initContainer:
            command: ["python", "manage.py", "migrate"]
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: myapp-component-based-app-secrets
                key: api-key
      - notContains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: DB_USERNAME
          any: true
