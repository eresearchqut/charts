suite: NetworkPolicy — FQDN Egress
templates:
  - networkpolicy-fqdn.yaml

release:
  name: myapp
  namespace: prod

set:
  components:
    api:
      image:
        repository: "example.com/app"
        tag: "latest"
      port: 8000
      command: ["python", "app.py"]
      livenessProbe:
        path: /healthz
      allowedFQDNs:
        - fqdn: "api.example.com"
          ports:
            - port: 443
              protocol: TCP
        - fqdn: "*.external.com"
    worker:
      image:
        repository: "example.com/app"
        tag: "latest"
      port: 8080
      command: ["node", "worker.js"]
      livenessProbe:
        path: /health
  networkPolicy: {}

tests:
  # --- Count: only components with allowedFQDNs get a policy ---
  - it: creates exactly one FQDN NetworkPolicy (only the component with allowedFQDNs)
    asserts:
      - hasDocuments:
          count: 1

  # --- Resource identity ---
  - it: resource is an Antrea NetworkPolicy with correct apiVersion and kind
    documentIndex: 0
    asserts:
      - equal:
          path: apiVersion
          value: crd.antrea.io/v1beta1
      - equal:
          path: kind
          value: NetworkPolicy

  # --- Metadata ---
  - it: name and labels match the owning component
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: myapp-component-based-app-api-fqdn
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api

  # --- spec.priority ---
  - it: sets priority to 5 (evaluated before default K8s NetworkPolicies)
    documentIndex: 0
    asserts:
      - equal:
          path: spec.priority
          value: 5

  # --- spec.appliedTo ---
  - it: appliedTo selects pods of the owning component by instance and component labels
    documentIndex: 0
    asserts:
      - equal:
          path: spec.appliedTo[0].podSelector.matchLabels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.appliedTo[0].podSelector.matchLabels["app.kubernetes.io/instance"]
          value: myapp

  # --- Egress: entry with ports ---
  - it: FQDN entry with ports renders action Allow, fqdn, and the specified ports
    documentIndex: 0
    asserts:
      - contains:
          path: spec.egress
          content:
            action: Allow
            to:
              - fqdn: "api.example.com"
            ports:
              - port: 443
                protocol: TCP

  # --- Egress: entry WITHOUT ports (wildcard) ---
  # The wildcard entry is the second item in the set list, so its egress index is 1.
  - it: FQDN entry without ports renders action Allow and fqdn but omits the ports key entirely
    documentIndex: 0
    asserts:
      - contains:
          path: spec.egress
          content:
            action: Allow
            to:
              - fqdn: "*.external.com"
      - notExists:
          path: spec.egress[1].ports

  # --- Disabled: no policies ---
  - it: no FQDN NetworkPolicy when networkPolicy is disabled
    set:
      networkPolicy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
