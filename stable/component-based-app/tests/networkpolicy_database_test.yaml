suite: NetworkPolicy — Database Isolation
templates:
  - networkpolicy-database.yaml

release:
  name: myapp
  namespace: prod

set:
  networkPolicy: {}
  database:
    enabled: true

tests:
  # --- Conditional creation ---
  - it: creates database policy when database and networkPolicy are both enabled
    asserts:
      - hasDocuments:
          count: 2
  - it: no database policy when database is disabled
    set:
      database:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: no database policy when networkPolicy is disabled
    set:
      networkPolicy:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # --- podSelector targets the CNPG cluster ---
  - it: podSelector targets the CNPG cluster pods
    documentIndex: 0
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["cnpg.io/cluster"]
          value: myapp-database

  # --- Ingress: components with allowDatabaseAccess ---
  - it: ingress allows PostgreSQL from components that allow database access
    set:
      components:
        api:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8000
          command: ["python", "app.py"]
          livenessProbe:
            path: /healthz
          allowDatabaseAccess: true
        worker:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8080
          command: ["node", "worker.js"]
          livenessProbe:
            path: /health
          allowDatabaseAccess: false
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: api
                    app.kubernetes.io/instance: myapp
            ports:
              - port: 5432
                protocol: TCP
      - notContains:
          any: true
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: worker
                    app.kubernetes.io/instance: myapp

  # --- Ingress: monitoring ---
  - it: ingress allows metrics scraping from monitoring namespace
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: monitoring
            ports:
              - port: 9187
                protocol: TCP

  # --- Ingress: CNPG operator ---
  - it: ingress allows the CNPG operator to manage the cluster
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: cnpg-system
            ports:
              - port: 8000
                protocol: TCP
              - port: 5432
                protocol: TCP

  # --- Ingress: intra-cluster replication ---
  - it: ingress allows intra-cluster pod-to-pod traffic for replication
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    cnpg.io/cluster: myapp-database
            ports:
              - port: 5432
                protocol: TCP

  # --- Ingress: upstream cnpg chart's own ping-test Helm hook ---
  - it: ingress allows the upstream cnpg cluster chart's ping-test hook pod
    documentIndex: 0
    asserts:
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: database-ping-test
            ports:
              - port: 5432
                protocol: TCP

  # --- Egress: ONLY DNS, intra-cluster, and API server ---
  - it: egress contains DNS, application access and operator access
    documentIndex: 0
    asserts:
      # DNS
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
      # Intra-cluster replication
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 5432
                protocol: TCP
            to:
              - podSelector:
                  matchLabels:
                    cnpg.io/cluster: myapp-database
      # Kubernetes API server: ports AND destination CIDRs MUST be on the
      # same rule, otherwise ports-only expands to egress-to-anywhere and
      # the CIDR-only half expands to all-ports-to-those-CIDRs.
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
              - port: 6443
                protocol: TCP
            to:
              - ipBlock:
                  cidr: 172.30.96.0/23
              - ipBlock:
                  cidr: 172.30.109.0/23
              - ipBlock:
                  cidr: 172.18.0.0/23
      # No unrestricted egress (no to: {} with empty podSelector/namespaceSelector)
      # any:true deliberately omitted: {} is a subset of every object and
      # would match legitimate egress peers (e.g. the intra-cluster rule).
      - notContains:
          path: spec.egress
          content:
            to:
              - {}
      # Exactly 3 egress rules: DNS, intra-cluster, API server (ports+to combined)
      - lengthEqual:
          path: spec.egress
          count: 3

  # --- No ingress rules for components without allowDatabaseAccess ---
  - it: no database ingress rules exist for components without allowDatabaseAccess
    set:
      components:
        web:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 80
          command: ["nginx"]
          livenessProbe:
            path: /
          allowDatabaseAccess: false
    documentIndex: 0
    asserts:
      - notContains:
          any: true
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/component: web
                    app.kubernetes.io/instance: myapp
