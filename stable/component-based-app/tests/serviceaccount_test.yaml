suite: Per-component ServiceAccount overrides
templates:
  - deployment.yaml

release:
  name: sa-test
  namespace: prod

capabilities:
  apiVersions:
    - v1
    - apps/v1

tests:
  - it: defaults to release helper name and global automount (disabled)
    set:
      components:
        api:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8000
          command: ["python", "run.py"]
          livenessProbe:
            path: /health
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: uses release fullname ServiceAccount and automount when serviceAccount enabled
    set:
      serviceAccount:
        enabled: true
        automount: true
      components:
        api:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8000
          command: ["python", "run.py"]
          livenessProbe:
            path: /health
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: sa-test-component-based-app
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: per-component overrides win over enabled global serviceAccount
    set:
      serviceAccount:
        enabled: true
        automount: true
      components:
        api:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8000
          command: ["python", "run.py"]
          livenessProbe:
            path: /health
          serviceAccountName: custom-sa
          automountServiceAccountToken: false
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: per-component overrides win over disabled global serviceAccount
    set:
      components:
        api:
          image:
            repository: "example.com/app"
            tag: "latest"
          port: 8000
          command: ["python", "run.py"]
          livenessProbe:
            path: /health
          serviceAccountName: jobs-sa
          automountServiceAccountToken: true
    template: deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: jobs-sa
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
