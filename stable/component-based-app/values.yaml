# Default values for the chart
# For usage view values.example.yaml, which also generates the documentation.
# This is the source of truth for the defaults.
# Defaults must stay in sync with values.example.yaml; enforced by scripts/check-values-sync.py.

# Helm release name override; falls back to the chart name.
nameOverride: ""
# Helm release full name override; falls back to <release>-<chart> (or the release name when it already contains the chart name).
fullnameOverride: ""
# Application version; when set, tags resources with the app.kubernetes.io/version label.
appVersion: ""

global: {}

resources: {}

components: {}

ingress:
  healthMonitor: System-HTTP
  applicationProfile: System-HTTP
  annotations: {}
  paths: []

# CloudNativePG cluster subchart (cloudnative-pg/charts, chart "cluster", aliased "database").
# Every key except `enabled` is passed through to the subchart; see upstream docs:
# https://github.com/cloudnative-pg/charts/tree/cluster-v0.8.1/charts/cluster
# The keys below are our infra defaults layered over the upstream values.
database:
  enabled: false
  cluster:
    instances: 1
    imageName: registry.eres.qut.edu.au/ghcr/cloudnative-pg/postgresql:17
    storage:
      size: 8Gi
      storageClass: vsan-file
    walStorage:
      enabled: true
      size: 2Gi
      storageClass: vsan-file
    resources:
      requests:
        cpu: "0.5"
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    affinity:
      enablePodAntiAffinity: true
      topologyKey: kubernetes.io/hostname
    monitoring:
      enabled: true
      prometheusRule:
        enabled: false
    initdb:
      dataChecksums: true
      walSegmentSize: 32
  backups:
    enabled: false
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    provider: s3
    endpointURL: https://s3.ap-southeast-2.amazonaws.com/
    # Required when backups are enabled, e.g. s3://eresearch-k8s-postgres-backup/<app>-<env>-backup
    destinationPath: ""
    secret:
      create: false
      # Required when backups are enabled: existing Secret with ACCESS_KEY_ID / ACCESS_SECRET_KEY
      name: ""
    wal:
      maxParallel: 32
    # @sync-ignore: kept out of values.example.yaml - would modify the allowed schema
    scheduledBackups:
      - name: daily-backup
        schedule: "0 0 4 * * *"
        backupOwnerReference: self
        method: plugin
        pluginConfiguration:
          name: barman-cloud.cloudnative-pg.io
    retentionPolicy: 14d

networkPolicy:
  enabled: true
  monitoringSelector:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
  cnpgOperatorSelector:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cnpg-system
  # Additional egress rules appended to the database NetworkPolicy (k8s NetworkPolicyEgressRule format).
  databaseExtraEgress: []

serviceAccount:
  enabled: false
  annotations: {}
  automount: false

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false

imageUpdate:
  enabled: false
  imageTagPattern: "^(?P<ts>[0-9]+)$"
  repository:
    branch: main
    namespace: flux-system
  updatePath: "."
  messageTemplate: |
    Automated image update

    Automation name: {{ .AutomationObject }}

    Files:
    {{ range $filename, $_ := .Changed.FileChanges -}}
    - {{ $filename }}
    {{ end -}}

    Objects:
    {{ range $resource, $changes := .Changed.Objects -}}
    - {{ $resource.Kind }} {{ $resource.Name }}
      Changes:
    {{- range $_, $change := $changes }}
        - {{ $change.OldValue }} -> {{ $change.NewValue }}
    {{ end -}}
    {{ end -}}
