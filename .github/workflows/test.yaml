name: lint and test charts
on: pull_request
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.1
      - uses: actions/setup-python@v7
        with:
          check-latest: true
          python-version: "3.10"
      - name: Add dependent Helm repos
        run: |
          helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts
          helm repo update

      # install & run pre-commit (vendored from precommit/action because it's deprecated and simple)
      - name: Install pre-commit
        shell: bash
        run: |
          python -m pip install pre-commit
          python -m pip freeze --local
      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        shell: bash
        run: |
          pre-commit install
          pre-commit install-hooks
          pre-commit run --show-diff-on-failure --color=always --all

      # helm chart testing
      - name: set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
      - name: run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct-lint.yaml }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct-lint.yaml
      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.14.0
      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config .github/ct-install.yaml
